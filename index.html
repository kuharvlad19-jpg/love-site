<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6 місяців разом ❤️</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;background:linear-gradient(135deg,#ffe6e6,#ffb3b3);color:#d32f2f;padding:30px 15px;margin:0;min-height:100vh}
.container{max-width:500px;margin:0 auto;background:white;padding:25px;border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,0.1)}
h1{font-size:2rem;margin-bottom:20px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:20px}
.gallery img{width:100%;height:150px;object-fit:cover;border-radius:12px;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
.btn{background-color:#ff4d6d;color:white;border:none;padding:12px 20px;font-size:1rem;border-radius:25px;cursor:pointer;display:inline-block;margin:15px 5px 0;font-weight:bold}
.btn-secondary{background-color:#999}
</style>
</head>
<body>
<div class="container">
<h1>6 місяців разом ❤️</h1>
<p>Натисніть кнопку нижче, щоб вибрати фотографії з вашого пристрою:</p>
<label class="btn">📷 Додати фото<input id="photoPicker" type="file" accept="image/*" multiple hidden></label>
<button class="btn btn-secondary" id="clearPhotos" type="button">Очистити</button>
<div class="gallery" id="galleryContainer"></div>
</div>
<script>
const photoPicker=document.getElementById('photoPicker');
const galleryContainer=document.getElementById('galleryContainer');
const clearPhotos=document.getElementById('clearPhotos');
photoPicker.addEventListener('change',function(e){
const files=e.target.files;
for(let i=0;i<files.length;i++){
const file=files[i];
if(file){
const reader=new FileReader();
reader.onload=function(event){
const img=document.createElement('img');
img.src=event.target.result;
galleryContainer.appendChild(img);
}
reader.readAsDataURL(file);
}
}
});
clearPhotos.addEventListener('click',function(){
galleryContainer.innerHTML='';
photoPicker.value='';
});
</script>
</body>
</html>
