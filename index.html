<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#351319">
<title>6 місяців разом ❤️</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#fff8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(145deg,#160910,#351319);padding:20px 14px 100px;display:flex;flex-direction:column;align-items:center}
.wrap{max-width:760px;width:100%;margin:auto;position:relative;z-index:2;text-align:center}
h1{font-size:2.5rem;margin:20px 0 10px;text-shadow:0 4px 15px rgba(255,77,109,0.4);animation:pulse 2s infinite alternate}
.subtitle{font-size:1.1rem;color:#ffb3c1;margin-bottom:40px;opacity:0.9}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px;width:100%;padding:10px}
.polaroid{background:#fff;padding:15px 15px 25px 15px;border-radius:4px;box-shadow:0 12px 25px rgba(0,0,0,0.35);transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);position:relative}
.polaroid:nth-child(odd){transform:rotate(-2deg)}
.polaroid:nth-child(even){transform:rotate(2deg)}
.polaroid:hover{transform:scale(1.05) rotate(0deg) translateY(-10px);z-index:5;box-shadow:0 20px 35px rgba(255,77,109,0.25)}
.polaroid img{width:100%;height:320px;object-fit:cover;border-radius:2px;border:1px solid #eaeaea}
.caption{margin-top:15px;font-family:"Comic Sans MS",cursive,sans-serif;font-size:1.4rem;color:#2b1115;font-weight:bold}
.audio-player-box{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(35,15,22,0.85);backdrop-filter:blur(10px);border:1px solid rgba(255,77,109,0.3);padding:12px 20px;border-radius:50px;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:flex;align-items:center;gap:12px;z-index:100;width:90%;max-width:400px}
.audio-player-box p{margin:0;font-size:0.85rem;color:#ffb3c1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-grow:1}
audio{height:30px;width:160px}
@keyframes pulse{to{transform:scale(1.03);text-shadow:0 4px 25px rgba(255,77,109,0.7)}}
</style>
</head>
<body>
<div class="wrap">
<h1>6 місяців разом ❤️</h1>
<p class="subtitle">Найкращі моменти нашого кохання</p>
<div class="gallery-grid">
<div class="polaroid"><img src="photo1.jpg.JPG"><div class="caption">Кохаю тебе ✨</div></div>
<div class="polaroid"><img src="photo2.jpg.JPG"><div class="caption">Наше щастя 🌸</div></div>
<div class="polaroid"><img src="photo3.jpg.JPG"><div class="caption">Разом назавжди 👩‍❤️‍👨</div></div>
<div class="polaroid"><img src="photo4.jpg.JPG"><div class="caption">Твоя посмішка 🥰</div></div>
<div class="polaroid"><img src="photo5.jpg.JPG"><div class="caption">Наші теплі дні ☀️</div></div>
<div class="polaroid"><img src="photo6.jpg.JPG"><div class="caption">Найкращі миті 💫</div></div>
<div class="polaroid"><img src="photo7.jpg.JPG"><div class="caption">Моє серденько ❤️</div></div>
<div class="polaroid"><img src="photo8.jpg.JPG"><div class="caption">6 місяців казки 👑</div></div>
</div>
</div>
<div class="audio-player-box">
<p>🎵 Меладзе & i got love</p>
<audio src="music.mp3" controls preload="auto" loop></audio>
</div>
</body>
</html>
